name: 远程编译与自动发布 (Remote Build & Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-release:
    name: 远程编译 Windows x64 汉化版并发布
    runs-on: windows-latest

    steps:
      - name: 检出远程仓库代码 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 .NET 8 SDK (Setup .NET)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 执行远程编译与资源打包 (Build RHI & DropHelper)
        shell: pwsh
        run: |
          Write-Output "正在远程编译 RHI 与所有依赖组件..."
          & tools/maintenance/publish-zh.ps1 -OutputName 'release'
          if (-not (Test-Path -LiteralPath "artifacts/release/RHI.exe")) {
              throw "RHI.exe 编译失败，未生成产物。"
          }
          Write-Output "远程编译完成，产物已成功生成在 artifacts/release/"

      - name: 编译简体中文单文件 EXE (Compile Inno Setup Installer)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
              throw "未检测到 Inno Setup 编译器。"
          }
          $fullPublishDir = (Resolve-Path "artifacts/release").Path
          $fullArtifactsDir = (Resolve-Path "artifacts").Path
          & $iscc "/DPublishDir=$fullPublishDir" "/DInstallerOutputDir=$fullArtifactsDir" "RHI Setup.iss"
          if (-not (Test-Path -LiteralPath "artifacts/RHI-v2.8.7-zh-CN.exe")) {
              throw "未成功生成 RHI-v2.8.7-zh-CN.exe。"
          }
          Write-Output "全量简体中文版 EXE 生成成功: artifacts/RHI-v2.8.7-zh-CN.exe"

      - name: 上传构建工件到 GitHub Actions (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RHI-v2.8.7-zh-CN
          path: artifacts/RHI-v2.8.7-zh-CN.exe

      - name: 创建并发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.7
          name: RHI v2.8.7 简体中文版
          body: |
            ## RHI (ReShade HDR 安装器) 简体中文版 v2.8.7

            本项目源码及安装程序由 GitHub Actions 云端虚拟环境直接从远程仓库源码编译构建。

            - **上游原项目**：[RankFTW/RHI](https://github.com/RankFTW/RHI)
            - **汉化发布仓库**：[XYZ-ZJ/RHI-CN](https://github.com/XYZ-ZJ/RHI-CN)

            ---

            ### 📦 本次发布资产
            - **`RHI-v2.8.7-zh-CN.exe`**：全量简体中文版 EXE 安装包（开箱即用，内置主程序、拖放辅助工具及全套 35 项配套配置文件与着色器运行库）。

            ---

            ### ✨ 汉化内容特性
            - **界面 100% 简体中文**：主窗口、侧边栏、所有设置与详情面板全面汉化。
            - **悬停提示 (Tooltip) 全覆盖**：205 处功能提示已完成中文本地化。
            - **内置快速入门指南 (FAQ)**：包含详细的入门步骤、ReShade、RenoDX、Luma、OptiScaler 及驱动设置教程。
            - **高阶设置与控制**：支持 DLSS 5 神经渲染、多帧生成 (MFG) 解锁、NVIDIA 驱动级配置管理与各游戏独立配置。
          files: |
            artifacts/RHI-v2.8.7-zh-CN.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
